name: 한국어 맞춤법 및 문법 검사 (Korean Spelling Checker)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.md'
      - '**.txt'
  workflow_dispatch:

jobs:
  korean-spelling-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # PR 코멘트 작성을 위한 권한

    steps:
      # 1. 저장소 코드 체크아웃
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 파이썬 환경 설정
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. korean-spelling-corrector 패키지 설치
      - name: 패키지 설치
        run: |
          pip install -e .

      # 4. PR에서 변경된 .md 및 .txt 파일 목록 추출
      - name: 변경된 대상 파일 탐색
        id: changed-files
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }} HEAD -- '*.md' '*.txt' || true)
          echo "files=$CHANGED" >> $GITHUB_OUTPUT
          echo "변경된 파일 목록:"
          echo "$CHANGED"

      # 5. 맞춤법 및 문법 점검 실행 (리포트 생성 및 Step Summary 자동 연동)
      - name: 맞춤법 점검 및 리포트 생성
        if: steps.changed-files.outputs.files != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 변경된 파일들에 대해 검사 수행 및 PR 리포트 파일 생성
          python -m ksc.cli check ${{ steps.changed-files.outputs.files }} --report pr_comment.md

      # 6. PR에 검사 결과 코멘트 자동 등록 (오류가 발견된 경우)
      - name: PR 코멘트 작성
        if: steps.changed-files.outputs.files != '' && hashFiles('pr_comment.md') != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: 'pr_comment.md'
